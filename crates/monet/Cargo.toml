[package]
name = "monet"
version = { workspace = true }
edition = { workspace = true }
authers  = { workspace = true }
description = "`monet` is an io-uring based, share-nothing (aka. thread-per-core) web framework with structured concurrency"
license = "MIT"

[dependencies]
# Runtime related
compio = { version = "0.19.1", features = ["io-compat", "net", "macros", "time", "fs", "io", "tls"] }
compio-net = "0.12.3"
compio-driver = "0.12.4"

# Rust async ecosystem
futures-util = "0.3.32"
futures-concurrency = "7.7.1"
futures-lite = "2.6.1"
futures = "0.3.32"

# web related
hyper = { version = "1.8.1", features = ["http1", "server"] }
http-body-util = { version = "0.1.3", features = ["full"] }
http-body = "1.0.1"
http = "1.4.0"
mime = "0.3.17"
mime_guess = "2.0.5"
socket2 = "0.6.2"
bytes = "1.11.1"
httpdate = "1.0.3"
send_wrapper = "0.6.0"

# Routing
matchit = "0.9.2"

# Serialization /Deserialization
serde = { version = "1.0.228", features = [ "derive" ] }
serde_core = "1.0.228"
serde_json = "1.0.149"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
form_urlencoded = "1.2.2"
serde_html_form = "0.4.0"
percent-encoding = "2.3.2"

# Error handling
thiserror = "2.0.18"

# Multithreading
core_affinity = "0.8.3"

# Optional requirements toggled by feature set
# Logging
tracing = { version =  "0.1.44", optional = true }
tracing-subscriber = { version =  "0.3.23", features = [ "env-filter" ], optional = true }

[features]
default = ["tracing"]
no-tracing = []
matched-path = []
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[lints]
workspace = true

[dev-dependencies]
jiff = "0.2.23"
